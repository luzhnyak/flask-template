{% extends 'base.html' %}
{% block title %}<title>Авторизація — Flask start</title>{% endblock %}
{% block body %}
<div class="container py-4">
  <h1>Авторизація</h1>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="mb-3">
      <label for="username" class="form-label">Логін</label>
      <input id="username" type="text" name="username" class="form-control" value="{{ request.form.get('username', '') }}" autocomplete="username" required>
    </div>
    <div class="mb-3">
      <label for="password" class="form-label">Пароль</label>
      <input id="password" type="password" name="password" class="form-control" autocomplete="current-password" required>
    </div>
    {% if GOOGLE_RECAPTCHA_SITE_KEY %}
      <div class="g-recaptcha mb-3" data-sitekey="{{ GOOGLE_RECAPTCHA_SITE_KEY }}"></div>
    {% endif %}
    <button type="submit" class="btn btn-success">Увійти</button>
  </form>
</div>
{% if GOOGLE_RECAPTCHA_SITE_KEY %}<script src="https://www.google.com/recaptcha/api.js" async defer></script>{% endif %}
{% endblock %}
