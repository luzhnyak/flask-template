{% extends 'base.html' %}
{% block title %}<title>Пошук — Flask start</title>{% endblock %}
{% block body %}
<div class="container py-4">
  <h1>Пошук по сайту</h1>
  {% if GOOGLE_CSE_ID %}
    <script async src="https://cse.google.com/cse.js?cx={{ GOOGLE_CSE_ID|urlencode }}"></script>
    <div class="gcse-search"></div>
  {% else %}<p>Для пошуку вкажіть GOOGLE_CSE_ID у налаштуваннях застосунку.</p>{% endif %}
</div>
{% endblock %}
