{% extends "base.html" %}
{% block title %}<title>{{ ARTICLE.title }} — Flask start</title>{% endblock %}
{% block metatags %}<meta name="description" content="{{ ARTICLE.desc[:200] }}">{% endblock %}
{% block body %}
<article class="article-content container py-4">
  <h1>{{ ARTICLE.title }}</h1>
  <nav aria-label="Хлібні крихти">
    <ol class="breadcrumb">
      <li class="breadcrumb-item"><a href="{{ url_for('main.index') }}">Головна</a></li>
      <li class="breadcrumb-item"><a href="{{ url_for('main.posts', cat_name=ARTICLE.category.alias) }}">{{ ARTICLE.category.name }}</a></li>
      <li class="breadcrumb-item active" aria-current="page">{{ ARTICLE.title }}</li>
    </ol>
  </nav>
  {{ (ARTICLE.textbody or "")|safe }}
</article>
{% endblock %}
