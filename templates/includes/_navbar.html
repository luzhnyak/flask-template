<header>
<nav class="mynavbar navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" href="{{ url_for('main.index') }}">Flask start</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Відкрити меню"><span class="navbar-toggler-icon"></span></button>
    <div id="navbarNav" class="collapse navbar-collapse">
      <ul class="navbar-nav me-auto">
        {% for CATEGORY in CATEGORYES %}
          <li class="nav-item"><a class="nav-link" href="{{ url_for('main.posts', cat_name=CATEGORY.alias) }}">{{ CATEGORY.name }}</a></li>
        {% endfor %}
        {% if current_user.is_authenticated %}
          <li class="nav-item"><a class="nav-link" href="{{ url_for('admin.index') }}">Адмінпанель</a></li>
          <li class="nav-item">
            <form method="post" action="{{ url_for('main.logout') }}">
              <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
              <button class="nav-link btn btn-link" type="submit">Вийти</button>
            </form>
          </li>
        {% else %}
          <li class="nav-item"><a class="nav-link" href="{{ url_for('main.login') }}">Увійти</a></li>
        {% endif %}
      </ul>
      <form class="d-flex" method="get" action="{{ url_for('main.search') }}">
        <input class="form-control form-control-sm me-2" name="q" type="search" placeholder="Пошук" aria-label="Пошук" value="{{ request.args.get('q', '') }}">
        <button class="btn btn-outline-light btn-sm" type="submit">Знайти</button>
      </form>
    </div>
  </div>
</nav>
</header>
