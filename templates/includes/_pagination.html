{% if PAGES.pages > 1 %}
<nav aria-label="Сторінки статей">
  <ul class="pagination">
    {% if PAGES.has_prev %}<li class="page-item"><a class="page-link" href="{{ url_for('main.posts', cat_name=CATEGORY.alias, page=PAGES.prev_num) }}" aria-label="Попередня">&laquo;</a></li>{% endif %}
    {% for PAGE in PAGES.iter_pages() %}
      {% if PAGE %}
        <li class="page-item{% if PAGE == PAGES.page %} active{% endif %}"><a class="page-link" href="{{ url_for('main.posts', cat_name=CATEGORY.alias, page=PAGE) }}"{% if PAGE == PAGES.page %} aria-current="page"{% endif %}>{{ PAGE }}</a></li>
      {% else %}<li class="page-item disabled"><span class="page-link">…</span></li>{% endif %}
    {% endfor %}
    {% if PAGES.has_next %}<li class="page-item"><a class="page-link" href="{{ url_for('main.posts', cat_name=CATEGORY.alias, page=PAGES.next_num) }}" aria-label="Наступна">&raquo;</a></li>{% endif %}
  </ul>
</nav>
{% endif %}
