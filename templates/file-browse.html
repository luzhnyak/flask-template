<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Зображення</title>
  <style>
    body { font-family: sans-serif; padding: 1rem; }
    .files { display: flex; flex-wrap: wrap; gap: 1rem; }
    .item { border: 1px solid #aaa; background: #fff; cursor: pointer; padding: .5rem; width: 160px; overflow-wrap: anywhere; }
    .item img { width: 140px; height: 120px; object-fit: contain; }
  </style>
</head>
<body>
  <h1>Виберіть зображення</h1>
  <div class="files">
  {% for item in files %}
    {% set image_url = url_for('static', filename='img' ~ item.path) if item.path and item.path.startswith('/') else url_for('main.media', filename=item.path or '') %}
    <button type="button" class="item" data-url="{{ image_url }}"><img src="{{ image_url }}" alt="{{ item.name }}" loading="lazy"><br>{{ item.name }}</button>
  {% else %}<p>Поки немає зображень.</p>{% endfor %}
  </div>
  <script>
    document.addEventListener('click', (event) => {
      const item = event.target.closest('.item');
      if (!item || !window.opener) return;
      const target = new URLSearchParams(window.location.search).get('target');
      window.opener.postMessage({type: 'media-selected', url: item.dataset.url, target}, window.location.origin);
      window.close();
    });
  </script>
</body>
</html>
